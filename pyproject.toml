[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-react-templatetags"
version = "0.1.0"
description = "Render React components in Django templates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "example_django_react_templatetags"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["django_react_templatetags", "tests"]
exclude = ["env", ".venv", "build", "dist", ".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF"]
ignore = ["B904", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["django_react_templatetags"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 120

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["django_react_templatetags"]
